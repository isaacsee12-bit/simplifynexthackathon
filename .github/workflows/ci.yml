name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GEMINI_API_KEY: ""
      VERCEL: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install frontend dependencies
        run: npm --prefix webapp ci
      - name: Test frontend
        run: npm --prefix webapp test
      - name: Build public assets for API routing tests
        run: npm --prefix webapp run build -- --outDir ../public --emptyOutDir
      - name: Test backend
        run: python -m unittest discover -s backend/tests -p "test_*.py"
      - name: Run offline investigation benchmark
        run: python backend/tests/benchmark_investigation.py --check
